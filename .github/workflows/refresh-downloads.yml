name: Refresh downloads index

# WHY THIS EXISTS
# The Eclipse Foundation publisher serves this repo's root byte-for-byte and
# runs no build. The /downloads page therefore reads a JSON index that is
# generated at build time, not queried live. A new `builds-YYYY-MM` release
# stays invisible until that index is regenerated and committed.
#
# This job does that on a schedule, so the page follows the releases without
# a human step.

on:
  schedule:
    # Every Monday at 04:17 UTC. The odd minute avoids the top-of-hour rush,
    # when GitHub delays scheduled jobs the most.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

# Never let two refreshes race to push the same files.
concurrency:
  group: refresh-downloads
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Regenerate the package index
        working-directory: site
        env:
          # The built-in token gives 1000 API calls per hour. The script needs
          # about 40. It exits non-zero if a fetch fails, so a partial index
          # is never committed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run manifest

      - name: Build and publish to the repository root
        working-directory: site
        run: npm run deploy

      - name: Commit and push only if the index changed
        run: |
          set -euo pipefail

          # Scope every git operation to the published paths plus the source
          # copy of the index. Nothing else is ever staged.
          PATHS=(index.html downloads _astro assets .published-files site/public/assets)

          if git diff --quiet -- "${PATHS[@]}"; then
            echo "No change. The releases have not moved since the last run."
            exit 0
          fi

          ARTIFACTS=$(node -e "console.log(require('./assets/packages.json').artifacts)")
          MONTHS=$(node -e "console.log(require('./assets/packages.json').months.map(m=>m.m).join(', '))")

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- "${PATHS[@]}"
          git commit -m "downloads: refresh package index (${ARTIFACTS} artifacts)" \
                     -m "Months: ${MONTHS}" \
                     -m "Generated by .github/workflows/refresh-downloads.yml"
          git push

          echo "Pushed. The Eclipse publisher picks it up within about 5 minutes."

      - name: Summary
        if: always()
        run: |
          {
            echo "### Downloads index"
            if [ -f assets/packages.json ]; then
              node -e '
                const m = require("./assets/packages.json");
                console.log("- Artifacts: **" + m.artifacts + "**");
                console.log("- Unique packages: **" + m.unique + "**");
                console.log("");
                console.log("| Month | Builds |");
                console.log("|---|---|");
                for (const x of m.months) console.log("| " + x.m + " | " + x.count + " |");
              '
            else
              echo "The index was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
